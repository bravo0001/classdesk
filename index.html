<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ClassDesk – Assignments</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#FFF4D6;--card:#fff;--tx:#111;--mut:#555;--bd:#111;--pri:#3A5BFF;--pri2:#E4EAFF;--ok:#0A7C49;--okb:#BDF2D8;--warn:#9A4A00;--warnb:#FFE0B0;--bad:#D3213F;--sh:5px 5px 0 #111;--yel:#FFD23F;--pink:#FF5D8F;--blu:#4CC9F0;--grn:#3DDC97;--org:#FF8A3D;--pur:#B39DFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17132a;--card:#251f42;--tx:#fff7e6;--mut:#bdb7dd;--bd:#f4ecd8;--pri:#9DB0FF;--pri2:#2f2a57;--ok:#6CF0B2;--okb:#14422f;--warn:#FFB866;--warnb:#44290f;--bad:#FF7A90;--sh:5px 5px 0 #7c5cff}}
:root[data-theme="dark"]{--bg:#17132a;--card:#251f42;--tx:#fff7e6;--mut:#bdb7dd;--bd:#f4ecd8;--pri:#9DB0FF;--pri2:#2f2a57;--ok:#6CF0B2;--okb:#14422f;--warn:#FFB866;--warnb:#44290f;--bad:#FF7A90;--sh:5px 5px 0 #7c5cff}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background-image:radial-gradient(var(--bd) 1px,transparent 1px);background-size:26px 26px;background-attachment:fixed}
h1,h2,h3,.logo,.big,button{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 80px}.in{max-width:1100px;margin:0 auto;padding:0 18px}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.1}h2{font-size:24px;margin:6px 0 14px}h3{font-size:19px}
.mut{color:var(--mut);font-size:13.5px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;display:flex;align-items:center;gap:8px}.logo i{font-style:normal;background:var(--pink);color:#111;border:2.5px solid var(--bd);border-radius:10px;padding:0 8px;box-shadow:2px 2px 0 var(--bd);transform:rotate(-6deg)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#111;font-weight:800;font-size:14px;flex:none;border:2.5px solid var(--bd)}
.card{background:var(--card);border:2.5px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--sh);transition:transform .12s,box-shadow .12s}
.card.hv:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--bd)}
.hero{border:2.5px solid var(--bd);border-radius:20px;padding:24px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--sh);color:#111;position:relative;overflow:hidden}
.hero.t{background:var(--blu)}.hero.s{background:var(--yel)}.hero:after{content:"✦";position:absolute;right:-6px;top:-22px;font-size:110px;opacity:.18;transform:rotate(15deg)}
.hero h1{font-size:30px}.hero p{margin:6px 0 0;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}}
.stat{border:2.5px solid var(--bd);border-radius:14px;padding:12px 14px;box-shadow:4px 4px 0 var(--bd);color:#111}.stat b{font-size:30px;display:block;font-family:"Bricolage Grotesque",sans-serif}.stat .mut{color:#111;font-weight:700}
.stat:nth-child(1){background:var(--pink)}.stat:nth-child(2){background:var(--grn)}.stat:nth-child(3){background:var(--yel)}.stat:nth-child(4){background:var(--pur)}
button{cursor:pointer;font-weight:700;font-size:15px;color:#111;background:var(--pink);border:2.5px solid var(--bd);border-radius:12px;padding:9px 18px;box-shadow:3px 3px 0 var(--bd);transition:transform .08s,box-shadow .08s}
button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--bd)}button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--bd)}
button.gh{background:var(--card);color:var(--tx)}button.hero-btn{background:#fff}button.sm{padding:5px 12px;font-size:13px;box-shadow:2px 2px 0 var(--bd)}button.dg{background:var(--card);color:var(--bad)}
input,textarea{width:100%;font:inherit;padding:11px 12px;border:2.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);margin:4px 0 12px;outline:none}
input:focus,textarea:focus{box-shadow:4px 4px 0 var(--pur)}input[type=range]{padding:0;accent-color:var(--pink);margin:8px 0;box-shadow:none}
label{font-size:13px;font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding:2px 2px 6px}.tabs button{background:var(--card);color:var(--tx);white-space:nowrap}.tabs button.on{background:var(--yel);color:#111}
.seg{display:flex;gap:8px;margin-bottom:14px}.seg button{flex:1;background:var(--card);color:var(--tx)}.seg button.on{background:var(--blu);color:#111}.seg button.on.s{background:var(--org)}
.tag{display:inline-block;font-size:12.5px;font-weight:800;padding:3px 11px;border-radius:30px;background:var(--pri2);color:var(--pri);border:2px solid var(--bd)}.tag.ok{background:var(--okb);color:var(--ok)}.tag.warn{background:var(--warnb);color:var(--warn)}.tag.bad{background:var(--warnb);color:var(--bad)}
.bar{height:16px;border-radius:12px;background:var(--card);border:2.5px solid var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--grn) 0 10px,#2bc784 10px 20px);border-right:2.5px solid var(--bd);transition:width .6s}
.sub{border-top:2.5px dashed var(--bd);margin-top:14px;padding-top:14px}pre{white-space:pre-wrap;font:inherit;margin:8px 0}
.sig{font-family:"Brush Script MT","Segoe Script","Snell Roundhand",cursive;font-size:23px;color:var(--pri)}input.sig{font-size:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.chip{background:var(--yel);color:#111;border-radius:30px;padding:3px 11px;font-size:13px;box-shadow:2px 2px 0 var(--bd)}
.empty{text-align:center;padding:36px;color:var(--mut)}.empty b{font-size:40px;display:block}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--yel);color:#111;border:2.5px solid #111;padding:11px 20px;border-radius:14px;font-weight:700;z-index:90;box-shadow:4px 4px 0 #111;animation:up .3s}
@keyframes up{from{opacity:0;transform:translate(-50%,12px)}}.fade{animation:pop .3s}@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.conf{position:fixed;top:-20px;z-index:95;pointer-events:none;font-size:24px;animation:fall 1.8s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:0}}
/* website */
.top{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:2.5px solid var(--bd);padding:12px 0;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.top .links{display:flex;gap:22px}.top .links a{cursor:pointer;font-weight:700}.top .links a:hover{color:var(--pink)}@media(max-width:760px){.top .links{display:none}}
.sec{padding:56px 0}.two{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center}@media(max-width:820px){.two{grid-template-columns:1fr}}
.pill{display:inline-block;background:var(--grn);color:#111;border:2.5px solid var(--bd);border-radius:30px;padding:3px 14px;font-weight:800;font-size:13.5px;box-shadow:2px 2px 0 var(--bd);margin-bottom:16px}
.big{font-size:clamp(38px,6.4vw,68px);font-weight:800;line-height:1.02;margin:0 0 16px;letter-spacing:-.03em}.big mark{background:var(--yel);color:#111;padding:0 10px;border:2.5px solid var(--bd);border-radius:12px;display:inline-block;transform:rotate(-2deg);box-shadow:4px 4px 0 var(--bd)}
.lead{font-size:18px;max-width:520px;margin:0 0 24px}
.mockwrap{position:relative;padding:10px}.mock{background:var(--card);border:2.5px solid var(--bd);border-radius:18px;padding:20px;box-shadow:8px 8px 0 var(--bd);transform:rotate(2deg)}
.stamp{position:absolute;right:-6px;bottom:-14px;width:96px;height:96px;border-radius:50%;background:var(--pink);color:#111;border:3px solid var(--bd);display:grid;place-items:center;font:800 28px "Bricolage Grotesque",sans-serif;transform:rotate(-14deg);box-shadow:4px 4px 0 var(--bd)}
.float{position:absolute;font-size:44px;animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-10px) rotate(8deg)}}
.marq{background:#111;color:var(--yel);border-block:2.5px solid #111;overflow:hidden;white-space:nowrap;padding:12px 0;font:800 22px "Bricolage Grotesque",sans-serif}.marq div{display:inline-block;animation:mq 22s linear infinite}@keyframes mq{to{transform:translateX(-50%)}}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}@media(max-width:820px){.g3{grid-template-columns:1fr}}@media(min-width:821px) and (max-width:980px){.g3{grid-template-columns:1fr 1fr}}
.ft{border:2.5px solid var(--bd);border-radius:18px;padding:22px;box-shadow:var(--sh);color:#111;transition:transform .12s}.ft:hover{transform:rotate(-1.5deg) translateY(-3px)}.ft span{font-size:34px;display:block;margin-bottom:8px}.ft p{margin:6px 0 0;font-weight:500}
.stp{display:flex;gap:14px;align-items:flex-start}.stp b{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--yel);color:#111;border:2.5px solid var(--bd);font:800 24px "Bricolage Grotesque",sans-serif;box-shadow:3px 3px 0 var(--bd)}
.rl{border:2.5px solid var(--bd);border-radius:22px;padding:28px;box-shadow:8px 8px 0 var(--bd);color:#111}.rl ul{padding-left:20px;font-weight:500;margin:12px 0 20px}.rl h2{font-size:30px}
footer{background:#111;color:#fff;padding:30px 0;margin-top:30px}footer .logo{color:#fff}
.ov{position:fixed;inset:0;z-index:80;background:rgba(17,17,17,.6);display:grid;place-items:center;padding:16px;overflow:auto}.md{width:100%;max-width:440px;margin:0}
.att{margin:10px 0}.att a{font-weight:700;color:var(--pri);text-decoration:none}.att a:hover{text-decoration:underline}label.pick{cursor:pointer;background:var(--blu);color:#111;border:2.5px solid var(--bd);border-radius:30px;padding:6px 14px;box-shadow:2px 2px 0 var(--bd);font-weight:700;font-size:14px}
</style></head><body><div id="app"><p class="mut">Loading…</p></div>
<script>
let db=null,cur=null,P=[],A=[],S=[],loaded=0,role="teacher",tab=null,filt="all",open=null,showNew=false,modal=false,editA=null,srt="new",N=[],draft={};
const $=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>t?new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short"}):"";
const me=()=>P.find(p=>p.id===cur);
const ss=(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}},sg=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};
const col=n=>"hsl("+([...String(n)].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360)+" 60% 50%)";
const av=n=>`<span class="av" style="background:${col(n)}">${esc((n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase())}</span>`;
const V=(id,d="")=>esc(draft[id]??d),D='oninput="draft[this.id]=this.value"';
function toast(m){document.querySelectorAll(".toast").forEach(e=>e.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function confetti(){for(let i=0;i<26;i++){const s=document.createElement("span");s.className="conf";s.textContent=["🎉","⭐","✨","🎊"][i%4];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2600)}}
function due(a){if(!a.due)return["No deadline",""];const d=Math.ceil((new Date(a.due+"T23:59:59")-Date.now())/864e5);return d<0?["Overdue by "+(-d)+"d","bad"]:d===0?["Due today","warn"]:d<=2?["Due in "+d+"d","warn"]:["Due in "+d+" days",""]}
async function init(){
  try{db=await Promise.race([claude.use("db"),new Promise((_,r)=>setTimeout(r,10000))])}catch(e){}
  if(!db){$("#app").innerHTML='<div class="card"><h3>Please open this page while signed in to claude.ai.</h3><p class="mut">Shared class data needs a signed-in viewer.</p></div>';return}
  cur=sg("acct");
  const er=e=>console.error(e);
  db.collection("profiles").onSnapshot(s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));loaded|=1;render()},er);
  db.collection("assignments").onSnapshot(s=>{A=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);loaded|=2;render()},er);
  db.collection("submissions").onSnapshot(s=>{S=s.docs.map(d=>({id:d.id,...d.data()}));loaded|=4;render()},er);
  db.collection("announcements").onSnapshot(s=>{N=s.docs.map(d=>({id:d.id,...d.data()}));loaded|=8;render()},er);
}
function render(force){
  if(loaded<15)return;const f=document.activeElement;
  if(!force&&f&&/INPUT|TEXTAREA/.test(f.tagName)&&f.closest("#app")&&f.type!=="range")return;
  const m=me();$("#app").innerHTML=m?'<div class="wrap">'+(m.role==="teacher"?teacher(m):student(m))+(tab==="ann"?annView(m):tab==="set"?setView(m):"")+'</div>':landing();
}
const sc=id=>document.getElementById(id)?.scrollIntoView({behavior:"smooth"});
function openLogin(r){role=r;modal=true;render(1);setTimeout(()=>{const e=$("#em");e&&e.focus()},60)}
/* ---------- WEBSITE + LOGIN ---------- */
function landing(){
  const ft=(c,i,t,p)=>`<div class="ft" style="background:var(--${c})"><span>${i}</span><h3>${t}</h3><p>${p}</p></div>`;
  const mq="ASSIGN ✦ SUBMIT ✦ SIGN ✦ EVALUATE ✦ FEEDBACK ✦ CREDITS ✦ ";
  return `<div class="top"><div class="in row"><div class="logo"><i>✎</i> ClassDesk</div><div class="links"><a onclick="sc('features')">Features</a><a onclick="sc('how')">How it works</a><a onclick="sc('roles')">Teachers & students</a></div><div class="row" style="gap:8px"><button class="gh sm" onclick="theme()" title="Dark / light">🌓</button><button class="gh sm" onclick="openLogin('student')">Student login</button><button class="sm" onclick="openLogin('teacher')">Teacher login</button></div></div></div>
  <section class="sec"><div class="in two"><div><span class="pill">✨ Free for every classroom</span><h1 class="big">Homework that feels like a <mark>high five.</mark></h1>
  <p class="lead">Teachers hand out assignments in seconds. Students sign and submit in one tap. Feedback and credits come back to the same place, with a signature on both sides.</p>
  <div class="row" style="justify-content:flex-start;gap:12px"><button onclick="openLogin('teacher')">I'm a teacher →</button><button class="gh" onclick="openLogin('student')">I'm a student →</button></div></div>
  <div class="mockwrap"><span class="float" style="left:-6px;top:-8px">⭐</span><span class="float" style="right:10px;top:-24px;animation-delay:1s">✏️</span>
  <div class="mock"><div class="row"><span class="tag warn">Due tomorrow</span><span class="mut">Ms. Rao</span></div><h3 style="margin:12px 0 6px">Essay: Someone I admire</h3><p class="mut" style="margin:0 0 14px">Write 300 words about a person who inspires you and why.</p>
  <div class="bar"><i style="width:78%"></i></div><p style="margin:14px 0 0">💬 <i>"Great storytelling, add one more example!"</i></p><div style="margin-top:10px">Signed <span class="sig">Aarav P.</span></div></div><div class="stamp">9/10</div></div></div></section>
  <div class="marq"><div>${mq.repeat(8)}</div></div>
  <section class="sec" id="features"><div class="in"><h2 class="big" style="font-size:clamp(30px,5vw,48px)">Everything a class needs. Nothing it doesn't.</h2><div class="g3" style="margin-top:26px">
  ${ft("yel","📝","Assign in seconds","Title, instructions, deadline and max credits. Published to every student instantly.")}${ft("pink","✍️","Sign & submit","Students type their answer, add a signature and send it with one tap.")}${ft("grn","⭐","Credits that count","Slide to give credits. Students watch their total fill up.")}${ft("blu","💬","Quick feedback","One-click comments or your own words, delivered next to the grade.")}${ft("org","🔀","Two panels","A teacher view and a student view, one click apart.")}${ft("pur","⚡","Always live","Submissions and grades show up on every screen, no refresh.")}</div></div></section>
  <section class="sec" id="how" style="background:var(--card);border-block:2.5px solid var(--bd)"><div class="in"><h2 class="big" style="font-size:clamp(30px,5vw,48px)">Three steps. Zero paper.</h2><div class="g3" style="margin-top:26px">
  <div class="stp"><b>1</b><div><h3>Teacher assigns</h3><p class="mut">Create a task with a deadline and credits.</p></div></div><div class="stp"><b>2</b><div><h3>Student submits</h3><p class="mut">Write, sign and send before the due date.</p></div></div><div class="stp"><b>3</b><div><h3>Teacher evaluates</h3><p class="mut">Add credits, feedback and a signature.</p></div></div></div></div></section>
  <section class="sec" id="roles"><div class="in"><div class="two" style="align-items:stretch"><div class="rl" style="background:var(--blu)"><h2>For teachers 👩‍🏫</h2><ul><li>Publish assignments to the whole class</li><li>Review a queue of submissions</li><li>Grade with a slider and feedback chips</li><li>Track every student's credits</li></ul><button class="hero-btn" onclick="openLogin('teacher')">Open teacher panel →</button></div>
  <div class="rl" style="background:var(--yel)"><h2>For students 🎒</h2><ul><li>See what's due and when</li><li>Write and sign your work</li><li>Get feedback and credits fast</li><li>Watch your credit ring grow</li></ul><button class="hero-btn" onclick="openLogin('student')">Open student panel →</button></div></div></div></section>
  <footer><div class="in row"><div class="logo"><i>✎</i> ClassDesk</div><span>Demo mode: sign in with any email and password.</span></div></footer>${modal?loginModal():""}`;
}
function loginModal(){return `<div class="ov" onclick="if(event.target===this){modal=false;render(1)}"><div class="card md fade"><div class="row"><h2 style="margin:0">Let's get you in 👋</h2><button class="gh sm" onclick="modal=false;render(1)">✕</button></div><p class="mut">Demo mode: any email and any password works.</p>
<div class="seg"><button class="${role==="teacher"?"on":""}" onclick="role='teacher';render(1)">👩‍🏫 Teacher</button><button class="${role==="student"?"on s":""}" onclick="role='student';render(1)">🎒 Student</button></div>
<label>Gmail</label><input id="em" type="email" placeholder="anything@gmail.com" ${D} value="${V("em")}">
<label>Password</label><input id="pw" type="password" placeholder="any password" ${D} value="${V("pw")}" onkeydown="if(event.key==='Enter')login()">
<label>Your name (first sign-up only)</label><input id="nm" placeholder="e.g. Priya Sharma" ${D} value="${V("nm")}" onkeydown="if(event.key==='Enter')login()">
<button style="width:100%" onclick="login()">Sign in as ${role} →</button><p class="mut" style="text-align:center;margin-bottom:0">or <a href="#" onclick="quick();return false" style="color:var(--pri);font-weight:700">fill a random demo ${role} account</a></p></div></div>`}
function quick(){const n=["aarav","meera","kabir","zoya","rohan","isha","dev","anaya"][Math.floor(Math.random()*8)]+Math.floor(Math.random()*90+10);draft.em=n+"@gmail.com";draft.pw=Math.random().toString(36).slice(2,9);draft.nm=n.replace(/\d+/,"").replace(/^./,c=>c.toUpperCase());render(1)}
const key=(r,e)=>r+"_"+e.replace(/[^a-z0-9]/g,"_");
async function login(){
  const em=(draft.em||"").trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return toast("Enter an email like name@gmail.com");
  if(!draft.pw)return toast("Enter any password");
  const id=key(role,em);
  if(!P.find(p=>p.id===id)){const nm=(draft.nm||"").trim()||em.split("@")[0];const p={name:nm,email:em,role,signature:nm,ts:Date.now()};await db.collection("profiles").doc(id).set(p);P.push({id,...p})}
  cur=id;ss("acct",id);draft={};tab=null;open=null;modal=false;render(1);toast("Signed in 🎉");window.scrollTo(0,0);
}
async function switchRole(){
  const m=me(),r=m.role==="teacher"?"student":"teacher",id=key(r,m.email);
  if(!P.find(p=>p.id===id)){const p={name:m.name,email:m.email,role:r,signature:m.signature,ts:Date.now()};await db.collection("profiles").doc(id).set(p);P.push({id,...p})}
  cur=id;ss("acct",id);role=r;tab=null;open=null;render(1);toast("Switched to the "+r+" panel");
}
function signOut(){cur=null;ss("acct",null);draft={};tab=null;open=null;modal=false;render(1);window.scrollTo(0,0)}
function nav(m){const o=m.role==="teacher"?"student":"teacher";return `<div class="nav"><div class="logo"><i>✎</i> ClassDesk</div><div class="row">${av(m.name)}<div><b>${esc(m.name)}</b> <span class="tag ${m.role==="teacher"?"":"warn"}">${m.role}</span><div class="mut">${esc(m.email)}</div></div><button class="sm" onclick="switchRole()">Switch to ${o} ↔</button><button class="gh sm" onclick="theme()" title="Dark / light">🌓</button><button class="gh sm" onclick="signOut()">Sign out</button></div></div>`}
const tabs=(cur_,list)=>`<div class="tabs">${list.map(([k,l])=>`<button class="${cur_===k?"on":""}" onclick="tab='${k}';render(1)">${l}</button>`).join("")}</div>`;
/* ---------- TEACHER ---------- */
function teacher(m){
  tab=tab||"asg";const mine=A.filter(a=>a.teacherId===cur),ids=mine.map(a=>a.id),subs=S.filter(s=>ids.includes(s.aid)),gr=subs.filter(s=>s.status==="graded"),pend=subs.length-gr.length;
  const avg=gr.length?Math.round(gr.reduce((n,s)=>n+s.credits/(mine.find(a=>a.id===s.aid)?.max||1),0)/gr.length*100):0;
  let h=nav(m)+`<div class="hero t"><div><h1>Hello, ${esc(m.name.split(" ")[0])} 👋</h1><p>${pend?`${pend} submission${pend>1?"s are":" is"} waiting for your review.`:"You're all caught up!"}</p></div><button class="hero-btn" onclick="showNew=true;tab='asg';render(1)">＋ New assignment</button></div>
  <div class="stats"><div class="stat"><b>${mine.length}</b><span class="mut">Assignments</span></div><div class="stat"><b>${subs.length}</b><span class="mut">Submissions</span></div><div class="stat"><b>${pend}</b><span class="mut">To review</span></div><div class="stat"><b>${avg}%</b><span class="mut">Avg score</span></div></div>`
  +tabs(tab,[["asg","📚 Assignments"],["rev","📥 Review ("+pend+")"],["stu","🎓 Students"],["ann","📢 Notices"],["set","⚙️ Profile"]]);
  if(tab==="asg"){
    if(showNew)h+=`<div class="card fade"><h3>New assignment</h3><label>Title</label><input id="t" ${D} value="${V("t")}" placeholder="e.g. Chapter 4 essay"><label>Instructions</label><textarea id="d" rows="3" ${D}>${V("d")}</textarea>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>Due date</label><input id="du" type="date" ${D} value="${V("du")}"></div><div><label>Max credits</label><input id="mx" type="number" min="1" ${D} value="${V("mx",10)}"></div></div>
    ${fileBox("asg","Attach a worksheet or reference file (optional)")}<div class="row"><button onclick="addA()">Publish to students</button><button class="gh" onclick="showNew=false;render(1)">Cancel</button></div></div>`;
    if(mine.length)h+=toolbar();if(!mine.length&&!showNew)h+='<div class="card empty"><b>📝</b>No assignments yet. Create your first one!</div>';
    flt(mine).forEach(a=>{if(editA===a.id){h+=editForm(a);return}const ss_=S.filter(s=>s.aid===a.id),[dl,dc]=due(a);h+=`<div class="card hv"><div class="row"><div><h3>${esc(a.title)}</h3><span class="mut">Max ${a.max} credits</span></div><span class="tag ${dc}">${dl}</span></div><pre class="mut">${esc(a.desc)}</pre>${att(a.fid,a.fname,a.fsize,a.ftype)}
    <div class="bar"><i style="width:${Math.min(100,ss_.length/Math.max(1,P.filter(p=>p.role==="student").length)*100)}%"></i></div><div class="row" style="margin-top:8px"><span class="mut">${ss_.length} submitted · ${ss_.filter(s=>s.status==="graded").length} graded</span><div class="row" style="gap:6px"><button class="gh sm" onclick="editA='${a.id}';render(1)">✏️ Edit</button><button class="dg sm" onclick="delA('${a.id}')">Delete</button></div></div></div>`});
  }
  if(tab==="rev"){
    h+=`<div class="chips">${[["all","All"],["pending","Pending"],["graded","Graded"]].map(([k,l])=>`<button class="chip" style="${filt===k?"background:var(--pink)":""}" onclick="filt='${k}';render(1)">${l}</button>`).join("")}</div>`;
    const list=subs.filter(s=>filt==="all"||(filt==="graded")===(s.status==="graded")).sort((a,b)=>b.ts-a.ts);
    if(!list.length)h+='<div class="card empty"><b>📭</b>Nothing here yet.</div>';
    list.forEach(s=>{const a=mine.find(x=>x.id===s.aid),isOpen=open===s.id,g=s.status==="graded";
      h+=`<div class="card hv"><div class="row"><div class="row" style="justify-content:flex-start">${av(s.studentName)}<div><b>${esc(s.studentName)}</b><div class="mut">${esc(a.title)} · ${fmt(s.ts)}</div></div></div><span>${s.late?'<span class="tag bad">⏰ Late</span> ':""}<span class="tag ${g?"ok":"warn"}">${g?"Graded "+s.credits+"/"+a.max:"Needs review"}</span></span></div>`;
      if(isOpen){h+=`<div class="sub fade"><pre>${esc(s.text)}</pre>${att(s.fid,s.fname,s.fsize,s.ftype)}<div class="mut">Student signature: <span class="sig">${esc(s.signature)}</span></div>
      <label style="display:block;margin-top:12px">Credits: <b id="o_${s.id}" style="color:var(--pri);font-size:16px">${draft["c_"+s.id]??s.credits??Math.round(a.max*.8)}</b> / ${a.max}</label>
      <input type="range" id="c_${s.id}" min="0" max="${a.max}" value="${draft["c_"+s.id]??s.credits??Math.round(a.max*.8)}" oninput="draft[this.id]=this.value;$('#o_${s.id}').textContent=this.value">
      <label>Feedback</label><div class="chips">${["Great work! 🌟","Needs more detail","Check your sources","Well structured","Please revise & resubmit"].map(c=>`<button class="chip" onclick="chip('f_${s.id}',this.textContent)">${c}</button>`).join("")}</div>
      <textarea id="f_${s.id}" rows="3" ${D}>${V("f_"+s.id,s.feedback||"")}</textarea>${fileBox("fb_"+s.id,"Attach a marked-up file (optional)")}${att(s.evalFid,s.evalFname,s.evalFsize,s.evalFtype)}<label>Your signature</label><input id="g_${s.id}" class="sig" ${D} value="${V("g_"+s.id,s.evalSignature||me().signature)}">
      <div class="row"><button onclick="grade('${s.id}')">${g?"Update":"Sign & share"} evaluation</button><button class="gh" onclick="open=null;render(1)">Close</button></div></div>`}
      else h+=`<div style="margin-top:10px"><button class="sm" onclick="open='${s.id}';render(1)">${g?"View / edit":"Evaluate"}</button></div>`;
      h+="</div>"});
  }
  if(tab==="stu"){h+='<div style="margin-bottom:14px"><button onclick="exportCsv()">⬇ Export gradebook (CSV)</button></div>';
    const st=P.filter(p=>p.role==="student");if(!st.length)h+='<div class="card empty"><b>🎓</b>No students have signed up yet.<br>Sign out and register as a student to test!</div>';
    st.forEach(p=>{const my=S.filter(s=>s.studentId===p.id&&ids.includes(s.aid)),g=my.filter(s=>s.status==="graded"),tot=g.reduce((n,s)=>n+s.credits,0),mx=g.reduce((n,s)=>n+(mine.find(a=>a.id===s.aid)?.max||0),0);
      h+=`<div class="card row">${av(p.name)}<div style="flex:1;min-width:140px"><b>${esc(p.name)}</b><div class="mut">${my.length} submitted · ${g.length} graded</div><div class="bar" style="margin-top:6px"><i style="width:${mx?tot/mx*100:0}%"></i></div></div><b style="font-size:20px">${tot}<span class="mut"> credits</span></b></div>`});
  }
  return h;
}
function chip(id,t){const e=document.getElementById(id);t=t.replace(/\s*[^\w\s.!,]+$/u,"");e.value=(e.value?e.value+" ":"")+t;draft[id]=e.value;e.focus()}
/* ---------- EXTRA FEATURES ---------- */
const flt=l=>{const q=(draft.q||"").toLowerCase();return l.filter(a=>!q||(a.title+" "+a.desc).toLowerCase().includes(q)).sort((a,b)=>srt==="due"?(a.due||"9999").localeCompare(b.due||"9999"):b.ts-a.ts)};
const toolbar=()=>`<div class="row" style="margin-bottom:14px"><input id="q" style="max-width:340px;margin:0" placeholder="🔍 Search assignments…" value="${V("q")}" oninput="srch(this)"><div class="chips" style="margin:0">${[["new","Newest"],["due","Due soon"]].map(([k,l])=>`<button class="chip" style="${srt===k?"background:var(--pink)":""}" onclick="srt='${k}';render(1)">${l}</button>`).join("")}</div></div>`;
function srch(el){draft.q=el.value;render(1);const e=$("#q");e.focus();e.setSelectionRange(999,999)}
function theme(){const d=document.documentElement,dk=(d.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark";d.dataset.theme=dk?"light":"dark"}
function annView(m){const t=m.role==="teacher";let h="";
  if(t)h+=`<div class="card"><h3>📢 Post to the class</h3><textarea id="an" rows="2" ${D} placeholder="e.g. Quiz on Friday, bring your notebooks!">${V("an")}</textarea><button onclick="postAnn()">Post notice</button></div>`;
  const L=[...N].sort((a,b)=>b.ts-a.ts);if(!L.length)h+='<div class="card empty"><b>📢</b>No notices yet.</div>';
  L.forEach(n=>h+=`<div class="card hv"><div class="row"><div class="row" style="justify-content:flex-start">${av(n.by)}<div><b>${esc(n.by)}</b><div class="mut">${fmt(n.ts)}</div></div></div>${t&&n.tid===cur?`<button class="dg sm" onclick="delAnn('${n.id}')">Delete</button>`:""}</div><pre>${esc(n.text)}</pre></div>`);return h}
async function postAnn(){const t=(draft.an||"").trim();if(!t)return toast("Write a notice first");await db.collection("announcements").doc("n"+Date.now()).set({text:t,by:me().name,tid:cur,ts:Date.now()});delete draft.an;render(1);toast("Notice posted 📢")}
async function delAnn(id){await db.collection("announcements").doc(id).delete();toast("Deleted")}
function setView(m){return `<div class="card"><h3>⚙️ Profile & settings</h3><p class="mut">Signed in as ${esc(m.email)} (${m.role})</p><label>Display name</label><input id="pn" ${D} value="${V("pn",m.name)}"><label>Signature</label><input id="ps" class="sig" ${D} value="${V("ps",m.signature)}"><div class="row"><button onclick="saveProf()">Save changes</button><button class="gh" onclick="theme()">🌓 Dark / light</button></div></div>`}
async function saveProf(){const m=me(),n=(draft.pn??m.name).trim(),g=(draft.ps??m.signature).trim();if(!n||!g)return toast("Name and signature can't be empty");await db.collection("profiles").doc(cur).update({name:n,signature:g});draft.pn=draft.ps=undefined;toast("Profile saved ✅")}
function editForm(a){return `<div class="card fade"><h3>✏️ Edit assignment</h3><label>Title</label><input id="e_t" ${D} value="${V("e_t",a.title)}"><label>Instructions</label><textarea id="e_d" rows="3" ${D}>${V("e_d",a.desc)}</textarea><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>Due date</label><input id="e_du" type="date" ${D} value="${V("e_du",a.due)}"></div><div><label>Max credits</label><input id="e_mx" type="number" min="1" ${D} value="${V("e_mx",a.max)}"></div></div><div class="row"><button onclick="saveA('${a.id}')">Save</button><button class="gh" onclick="editA=null;render(1)">Cancel</button></div></div>`}
async function saveA(id){const a=A.find(x=>x.id===id);await db.collection("assignments").doc(id).update({title:(draft.e_t??a.title).trim()||"Untitled",desc:draft.e_d??a.desc,due:draft.e_du??a.due,max:+(draft.e_mx??a.max)||10});["e_t","e_d","e_du","e_mx"].forEach(k=>delete draft[k]);editA=null;render(1);toast("Saved ✅")}
async function withdraw(id,aid){if(!confirm("Withdraw this submission so you can edit it? (Re-attach any file.)"))return;const s=S.find(x=>x.id===id);draft["x_"+aid]=s.text;draft["y_"+aid]=s.signature;await db.collection("submissions").doc(id).delete();tab="todo";open=aid;render(1)}
async function exportCsv(){const ids=A.filter(a=>a.teacherId===cur).map(a=>a.id),q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',rows=[["Student","Email","Assignment","Submitted","Late","Credits","Max","Percent","Feedback"]];
  S.filter(s=>ids.includes(s.aid)).forEach(s=>{const a=A.find(x=>x.id===s.aid),p=P.find(x=>x.id===s.studentId);rows.push([s.studentName,p?.email||"",a.title,new Date(s.ts).toLocaleString(),s.late?"Yes":"No",s.credits??"",a.max,s.status==="graded"?Math.round(s.credits/a.max*100)+"%":"",s.feedback||""])});
  if(rows.length<2)return toast("No submissions to export yet");
  try{const d=await claude.use("downloads");if(!d)return toast("Downloads unavailable here");await d.save({filename:"gradebook.csv",data:rows.map(r=>r.map(q).join(",")).join("\n")});toast("Gradebook saved 📊")}catch(e){if(e&&e.code!=="declined")toast("Could not save the file")}}
/* ---------- FILE UPLOADS ---------- */
const FL={},OKX=/\.(pdf|png|jpe?g|gif|webp|svg|mp4|webm|mov|txt|md|csv|json)$/i;
const kb=n=>n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
function pick(k,el){const f=el.files[0];if(!f)return;
  if(!OKX.test(f.name))return toast("Word/Office files aren't supported. Save as PDF first.");
  if(f.size>20*1048576)return toast("File is too big (max 20 MB)");
  FL[k]=f;render(1);toast("Attached "+f.name+" 📎")}
function fileBox(k,l){const f=FL[k];return `<label>${l}</label><div class="row" style="justify-content:flex-start;margin:6px 0 12px"><label class="pick">📎 Choose file<input type="file" id="fi_${k}" hidden onchange="pick('${k}',this)"></label><span class="mut">${f?esc(f.name)+" · "+kb(f.size):"PDF, image, video, text or CSV · max 20 MB"}</span>${f?`<button class="dg sm" onclick="delete FL['${k}'];render(1)">Remove</button>`:""}</div>`}
const att=(id,n,z,t)=>id?`<div class="att"><a href="/_blob/${id}" target="_blank" rel="noopener">${/^image\//.test(t||"")?`<img src="/_blob/${id}" alt="" style="max-width:100%;max-height:220px;border:2.5px solid var(--bd);border-radius:10px;display:block;margin-bottom:8px">`:""}📎 ${esc(n)} · ${kb(z||0)}</a></div>`:"";
async function up(k){const f=FL[k];if(!f)return null;toast("Uploading… ⏳");
  const as=await claude.use("assets");if(!as){toast("File uploads aren't available for this account");throw 0}
  try{const r=await as.upload(f);return{fid:r.id,fname:f.name,fsize:f.size,ftype:f.type||r.contentType||""}}
  catch(e){toast(e&&e.code==="unsupported_type"?"That file type isn't supported. Try PDF, image, text or CSV.":"Upload failed. Please try again.");throw e}}
async function addA(){
  const t=(draft.t||"").trim();if(!t)return toast("Please add a title");
  let fx={};try{fx=await up("asg")||{}}catch(e){return}await db.collection("assignments").doc("a"+Date.now()).set({...fx,title:t,desc:draft.d||"",due:draft.du||"",max:+draft.mx||10,teacherId:cur,teacherName:me().name,ts:Date.now()});
  draft={};delete FL.asg;showNew=false;render(1);toast("Assignment published ✅");
}
async function delA(id){if(!confirm("Delete this assignment and its submissions?"))return;await db.collection("assignments").doc(id).delete();for(const s of S.filter(s=>s.aid===id))await db.collection("submissions").doc(s.id).delete();toast("Deleted")}
async function grade(id){
  const s=S.find(x=>x.id===id),a=A.find(x=>x.id===s.aid),c=+(draft["c_"+id]??s.credits??Math.round(a.max*.8)),sig=(draft["g_"+id]??s.evalSignature??me().signature).trim();
  if(!sig)return toast("Please sign your evaluation");
  let fx={};try{const u=await up("fb_"+id);if(u)fx={evalFid:u.fid,evalFname:u.fname,evalFsize:u.fsize,evalFtype:u.ftype}}catch(e){return}await db.collection("submissions").doc(id).update({...fx,credits:c,feedback:draft["f_"+id]??s.feedback??"",evalSignature:sig,evalBy:me().name,evalTs:Date.now(),status:"graded"});
  open=null;["c_","f_","g_"].forEach(p=>delete draft[p+id]);delete FL["fb_"+id];render(1);toast("Evaluation shared with student ✅");
}
/* ---------- STUDENT ---------- */
function student(m){
  tab=tab||"todo";const my=S.filter(s=>s.studentId===cur),gr=my.filter(s=>s.status==="graded"),mx=gr.reduce((n,s)=>n+(A.find(a=>a.id===s.aid)?.max||0),0),tot=gr.reduce((n,s)=>n+s.credits,0),pct=mx?tot/mx:0;
  const todo=A.filter(a=>!my.find(s=>s.aid===a.id)),sub=my.filter(s=>s.status!=="graded");
  let h=nav(m)+`<div class="hero s"><div><h1>Hi, ${esc(m.name.split(" ")[0])} 🎒</h1><p>${todo.length?todo.length+" assignment"+(todo.length>1?"s":"")+" to do.":"Nothing pending — nice!"}</p></div>
  <div class="row" style="gap:14px"><svg width="96" height="96" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="10"/><circle cx="50" cy="50" r="42" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round" stroke-dasharray="${pct*264} 264" transform="rotate(-90 50 50)" style="transition:stroke-dasharray .8s"/><text x="50" y="56" text-anchor="middle" fill="#111" font-size="22" font-weight="700">${tot}</text></svg><div><b style="font-size:18px">${tot} credits</b><div style="opacity:.9">of ${mx} possible</div></div></div></div>`
  +tabs(tab,[["todo","📝 To do ("+todo.length+")"],["sub","⏳ Submitted ("+sub.length+")"],["done","⭐ Graded ("+gr.length+")"],["ann","📢 Notices"],["set","⚙️ Profile"]]);
  if(tab==="todo"){if(todo.length)h+=toolbar();if(!todo.length)h+='<div class="card empty"><b>🎉</b>All done! Enjoy the break.</div>';
    flt(todo).forEach(a=>{const[dl,dc]=due(a),w=(draft["x_"+a.id]||"").trim().split(/\s+/).filter(Boolean).length;h+=`<div class="card hv"><div class="row"><div><h3>${esc(a.title)}</h3><span class="mut">By ${esc(a.teacherName)} · Max ${a.max} credits</span></div><span class="tag ${dc}">${dl}</span></div><pre>${esc(a.desc)}</pre>${att(a.fid,a.fname,a.fsize,a.ftype)}
    ${open===a.id?`<div class="sub fade"><label>Your answer</label><textarea id="x_${a.id}" rows="5" oninput="draft[this.id]=this.value;$('#w_${a.id}').textContent=this.value.trim().split(/\\s+/).filter(Boolean).length" placeholder="Write your work here…">${V("x_"+a.id)}</textarea><div class="mut" style="margin:-6px 0 10px"><span id="w_${a.id}">${w}</span> words</div>${fileBox("s_"+a.id,"Upload your work (PDF, image, text…)")}
    <label>Sign (type your name)</label><input id="y_${a.id}" class="sig" ${D} value="${V("y_"+a.id,m.signature)}"><div class="row"><button onclick="submitA('${a.id}')">Sign & submit ✍️</button><button class="gh" onclick="open=null;render(1)">Cancel</button></div></div>`:`<div class="row" style="justify-content:flex-start"><button onclick="open='${a.id}';render(1)">Start working</button><button class="gh" onclick="open='${a.id}';render(1);setTimeout(()=>document.getElementById('fi_s_${a.id}')?.click(),80)">📎 Upload file</button></div>`}</div>`})}
  if(tab==="sub"){if(!sub.length)h+='<div class="card empty"><b>📭</b>Nothing waiting for review.</div>';sub.forEach(s=>{const a=A.find(x=>x.id===s.aid);if(a)h+=`<div class="card"><div class="row"><h3>${esc(a.title)}</h3><span class="tag warn">Awaiting teacher</span></div><pre class="mut">${esc(s.text)}</pre>${att(s.fid,s.fname,s.fsize,s.ftype)}<div class="mut">Signed <span class="sig">${esc(s.signature)}</span> · ${fmt(s.ts)}</div><div style="margin-top:10px"><button class="gh sm" onclick="withdraw('${s.id}','${s.aid}')">✏️ Withdraw & edit</button></div></div>`})}
  if(tab==="done"){if(!gr.length)h+='<div class="card empty"><b>⭐</b>Graded work will appear here.</div>';gr.forEach(s=>{const a=A.find(x=>x.id===s.aid);if(a)h+=`<div class="card hv"><div class="row"><h3>${esc(a.title)}</h3><span class="tag ok">${s.credits}/${a.max} credits</span></div><div class="bar" style="margin:10px 0"><i style="width:${s.credits/a.max*100}%"></i></div>
    <div class="sub" style="margin-top:6px"><b>💬 Feedback</b><pre>${esc(s.feedback||"No written feedback.")}</pre>${att(s.evalFid,s.evalFname,s.evalFsize,s.evalFtype)}<div class="mut">Evaluated by ${esc(s.evalBy)} · <span class="sig">${esc(s.evalSignature)}</span> · ${fmt(s.evalTs)}</div></div></div>`})}
  return h;
}
async function submitA(aid){
  const t=(draft["x_"+aid]||"").trim(),g=(draft["y_"+aid]??me().signature).trim();
  if(!t&&!FL["s_"+aid])return toast("Write your answer or attach a file");if(!g)return toast("Please sign to submit");
  let fx={};try{fx=await up("s_"+aid)||{}}catch(e){return}const _a=A.find(x=>x.id===aid);await db.collection("submissions").doc(aid+"_"+cur).set({...fx,late:!!(_a&&_a.due&&Date.now()>new Date(_a.due+"T23:59:59")),aid,studentId:cur,studentName:me().name,text:t,signature:g,ts:Date.now(),status:"submitted"});
  delete FL["s_"+aid];delete draft["x_"+aid];delete draft["y_"+aid];open=null;tab="sub";render(1);toast("Submitted! 🚀");confetti();
}
init();
</script></body></html>
